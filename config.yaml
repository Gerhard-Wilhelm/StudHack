# Basis-URL der Stud.IP Instanz der MLU
studip_url: https://studip.uni-halle.de

# Zielordner für Downloads: <vault>/06 Anhänge/<Kürzel>/
vault: ~/StudHack/Studium Vault

# Auswahlfragen pro Wochennotiz für generator/generate_mc.py
# (single = genau eine von vier Antworten richtig, multiple = eine oder mehrere richtig).
# Module ohne eigenen Eintrag "auswahlfragen" bekommen diese Werte.
auswahlfragen:
  single: 4
  multiple: 2

# Module mit ihren Stud.IP Kurs-IDs (Vorlesung, Übung, ...)
