<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dunkelgrau mit sanftem Verlauf wie andere dunkle iOS-Icons, nicht reines Schwarz -->
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333334"/>
      <stop offset="1" stop-color="#151516"/>
    </linearGradient>
    <!-- Karten ohne Füllung: der Hintergrund scheint durch. Die hintere Karte endet an der vorderen. -->
    <mask id="hinter-vorne" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="118" y="150" width="276" height="188" rx="18" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#grund)"/>
  <!-- Motiv um 30 % vergrößert, damit weniger Hintergrund zu sehen ist -->
  <g transform="translate(256 256) scale(1.3) translate(-256 -256)">
    <g mask="url(#hinter-vorne)">
      <g transform="rotate(-8 256 256)">
        <rect x="118" y="168" width="276" height="188" rx="18" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="12"/>
      </g>
    </g>
    <rect x="118" y="150" width="276" height="188" rx="18" fill="none" stroke="#fff" stroke-width="12"/>
    <path d="M206 246 l36 34 l66 -68" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
